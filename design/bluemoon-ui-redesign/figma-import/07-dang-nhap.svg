<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-label="Đăng nhập BlueMoon"><title>Đăng nhập BlueMoon</title><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F5F7FA"/><rect x="0" y="0" width="680" height="1000" rx="0" fill="#142D3D"/><rect x="60" y="58" width="42" height="42" rx="12" fill="#116A73"/><text x="81" y="87" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">b</text><text x="116" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start">bluemoon</text><text x="60" y="289" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF" text-anchor="start">Quản lý gọn gàng.</text><text x="60" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700" fill="#FFFFFF" text-anchor="start">Mỗi ngày nhẹ nhàng hơn.</text><text x="60" y="409" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#BDD0DB" text-anchor="start">Căn hộ, cư dân và hồ sơ ở cùng một nơi.</text><rect x="60" y="473" width="34" height="34" rx="9" fill="#244653"/><g transform="translate(67 480) scale(0.8333333333333334)" fill="none" stroke="#B9E3DC" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L20 5"/></g><text x="110" y="499" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#E5EEF2" text-anchor="start">Tìm thông tin nhanh</text><rect x="60" y="536" width="34" height="34" rx="9" fill="#244653"/><g transform="translate(67 543) scale(0.8333333333333334)" fill="none" stroke="#B9E3DC" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L20 5"/></g><text x="110" y="562" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#E5EEF2" text-anchor="start">Cập nhật ngay tại hồ sơ</text><rect x="60" y="599" width="3