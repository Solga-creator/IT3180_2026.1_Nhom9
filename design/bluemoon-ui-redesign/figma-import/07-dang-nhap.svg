" y="515" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#607486" text-anchor="start">Nhập mật khẩu</text><rect x="794" y="584" width="492" height="50" rx="8" fill="#116A73"/><text x="1040.0" y="614.0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Đăng nhập</text><text x="1040" y="681" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#607486" text-anchor="middle">Bạn là cư dân chưa có tài khoản?</text><rect x="794" y="706" width="492" height="48" rx="8" fill="#FFFFFF" stroke="#E3EAF0"/><text x="1040.0" y="735.0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#172B3A" text-anchor="middle">Đăng ký tài khoản cư dân</text><text x="1040" y="813" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#607486" text-anchor="middle">Tài khoản cư dân cần được Ban quản trị phê duyệt.</text></svg>